[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-ai-modular"
version = "0.1.0"
description = "Modular MT5 AI system scaffold with MCP integration adapters (planning/early implementation)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "modules*", "integrations*", "shared*"]
